#!/usr/bin/env bash

# # Define the directory where tools will be installed
# TOOLS="$HOME/tools"
# mkdir -p "$TOOLS"

# ----------------------------------------------------------------------------
# Versions
# ----------------------------------------------------------------------------
# Pinned in one place so a bump is a one-line change instead of six.
#
# CentOS 7 note: every binary below was checked with `readelf -V` to confirm it
# needs no glibc symbol newer than 2.17 (CentOS 7's glibc), or is statically
# linked and needs none at all:
#   nvim   -> dynamic, max GLIBC_2.17  (this is why we use the neovim-releases
#             repo rather than neovim/neovim, whose builds need glibc 2.31+)
#   rg/fd/bat -> static-pie musl, no glibc dependency
#   fzf/tmux  -> statically linked, no glibc dependency
NVIM_VERSION="v0.12.4"
RG_VERSION="15.2.0"
FD_VERSION="v10.4.2"
BAT_VERSION="v0.26.1"
VIVID_VERSION="v0.10.1"
FZF_VERSION="0.74.2"
TMUX_VERSION="3.7b"

tools=()
# Define tools with their attributes

declare -A nvim

nvim["name"]="nvim"
nvim["type"]="bin"
# Check unsupported releases for glibc lower then 2.17.
# https://github.com/neovim/neovim-releases
nvim["url"]="https://github.com/neovim/neovim-releases/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
nvim["ssh_url"]="${nvim[url]}"
nvim["dpath"]="$TOOLS"
nvim["dtool"]="wget"
nvim["switches"]="--directory-prefix=$TOOLS"
nvim["post_proc_command"]="tar xzf nvim-linux-x86_64.tar.gz -C $TOOLS"
nvim["src_path"]="$TOOLS/nvim/bin/nvim"
nvim["sym_path"]="$TOOLS/bin/nvim"
nvim["install_mode"]="all" # local, remote, all, none

tools=("${tools[@]}" "nvim") # Append nvim to older values

declare -A rg

rg["name"]="ripgrep" # This name should match the post process command used name and src_path name
rg["type"]="bin"
rg["url"]="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
rg["ssh_url"]="${rg[url]}"
rg["dpath"]="$TOOLS"
rg["dtool"]="wget"
rg["switches"]="--directory-prefix=$TOOLS"
rg["post_proc_command"]="tar xzf ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz -C $TOOLS"
rg["src_path"]="$TOOLS/ripgrep/rg"
rg["sym_path"]="$TOOLS/bin/rg"
rg["install_mode"]="all"

tools=("${tools[@]}" "rg") # Append rg to older values

declare -A fd

fd["name"]="fd"
fd["type"]="bin"
# NOTE: this used to pull the `i686` (32-bit) build on a 64-bit host. Now x86_64.
fd["url"]="https://github.com/sharkdp/fd/releases/download/${FD_VERSION}/fd-${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz"
fd["ssh_url"]="${fd[url]}"
fd["dpath"]="$TOOLS"
fd["dtool"]="wget"
fd["switches"]="--directory-prefix=$TOOLS"
fd["post_proc_command"]="tar xzf fd-${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz -C $TOOLS"
fd["src_path"]="$TOOLS/fd/fd"
fd["sym_path"]="$TOOLS/bin/fd"
fd["install_mode"]="all"

tools=("${tools[@]}" "fd") # Append fd to older values

declare -A bat

bat["name"]="bat"
bat["type"]="bin"
# NOTE: this used to pull the `i686` (32-bit) build on a 64-bit host. Now x86_64.
bat["url"]="https://github.com/sharkdp/bat/releases/download/${BAT_VERSION}/bat-${BAT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
bat["ssh_url"]="${bat[url]}"
bat["dpath"]="$TOOLS"
bat["dtool"]="wget"
bat["switches"]="--directory-prefix=$TOOLS"
bat["post_proc_command"]="tar xzf bat-${BAT_VERSION}-x86_64-unknown-linux-musl.tar.gz -C $TOOLS"
bat["src_path"]="$TOOLS/bat/bat"
bat["sym_path"]="$TOOLS/bin/bat"
bat["install_mode"]="all"

tools=("${tools[@]}" "bat") # Append bat to older values

declare -A vivid

vivid["name"]="vivid"
vivid["type"]="bin"
vivid["url"]="https://github.com/sharkdp/vivid/releases/download/${VIVID_VERSION}/vivid-${VIVID_VERSION}-x86_64-unknown-linux-musl.tar.gz"
vivid["ssh_url"]="${vivid[url]}"
vivid["dpath"]="$TOOLS"
vivid["dtool"]="wget"
vivid["switches"]="--directory-prefix=$TOOLS"
vivid["post_proc_command"]="tar xzf vivid-${VIVID_VERSION}-x86_64-unknown-linux-musl.tar.gz -C $TOOLS"
vivid["src_path"]="$TOOLS/vivid/vivid"
vivid["sym_path"]="$TOOLS/bin/vivid"
vivid["install_mode"]="all"

# NOTE: vivid is intentionally NOT in the `tools` array -- .aliases and the
# `lsth` function both already degrade gracefully when it is absent. Add
# "vivid" below to opt in.
# tools=("${tools[@]}" "vivid") # Append vivid to older values

declare -A fzf

fzf["name"]="fzf"
fzf["type"]="bin"
fzf["url"]="https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz"
fzf["ssh_url"]="${fzf[url]}"
fzf["dpath"]="$TOOLS"
fzf["dtool"]="wget"
fzf["switches"]="--directory-prefix=$TOOLS"
# The fzf tarball is a bare binary, so unpack into its own dir first; the
# installer then renames <name>-build -> <name>.
# .bashrc settings are already handled in $DOTS/config/fzf/.fzfrc, hence no --update-rc.
fzf["post_proc_command"]="mkdir -p $TOOLS/fzf-build && tar xzf fzf-${FZF_VERSION}-linux_amd64.tar.gz -C $TOOLS/fzf-build/"
fzf["src_path"]="$TOOLS/fzf/fzf"
fzf["sym_path"]="$TOOLS/bin/fzf"
fzf["install_mode"]="all"

tools=("${tools[@]}" "fzf") # Append fzf to older values

declare -A tmux

tmux["name"]="tmux"
tmux["type"]="bin"
tmux["url"]="https://github.com/tmux/tmux-builds/releases/download/v${TMUX_VERSION}/tmux-${TMUX_VERSION}-linux-x86_64.tar.gz"
tmux["ssh_url"]="${tmux[url]}"
tmux["version_or_branch"]="v${TMUX_VERSION}"
tmux["dpath"]="$TOOLS"
tmux["dtool"]="wget"
tmux["switches"]="--directory-prefix=$TOOLS"
tmux["post_proc_command"]="mkdir -p $TOOLS/tmux-build && tar xzf tmux-${TMUX_VERSION}-linux-x86_64.tar.gz -C $TOOLS/tmux-build"
tmux["src_path"]="$TOOLS/tmux/tmux"
tmux["sym_path"]="$TOOLS/bin/tmux"
tmux["install_mode"]="all"

tools=("${tools[@]}" "tmux") # Append tmux to older values
