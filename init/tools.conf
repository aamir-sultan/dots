# Tools installed by init/tools.sh
#
# One row per tool, whitespace separated. Blank lines and whole-line comments
# are ignored; the url column runs to the end of the line, so a comment cannot
# trail a row.
#
#   name     Command name. Also the install directory ($DOTS/tools/<name>) and
#            the symlink created in $DOTS/tools/bin/<name>.
#   version  Upstream release. Substituted into url wherever {v} appears, so a
#            bump is a one-field edit. Changing it re-installs on the next run.
#   mode     Which sessions --all installs the tool in:
#              never   never; only when asked for by name, e.g. --vivid
#              local   only outside an SSH session
#              remote  only inside an SSH session
#              always  every session
#   bin      Path of the executable inside the unpacked archive.
#   url      Download url. {v} is replaced by version.
#
# CentOS 7: every binary below was checked with `readelf -V` to need no glibc
# symbol newer than 2.17, or to be statically linked.

# name   version  mode    bin       url

# neovim-releases, not neovim/neovim: the latter's builds need glibc 2.31+.
nvim     v0.12.4  always  bin/nvim  https://github.com/neovim/neovim-releases/releases/download/{v}/nvim-linux-x86_64.tar.gz

rg       15.2.0   always  rg        https://github.com/BurntSushi/ripgrep/releases/download/{v}/ripgrep-{v}-x86_64-unknown-linux-musl.tar.gz
fd       v10.4.2  always  fd        https://github.com/sharkdp/fd/releases/download/{v}/fd-{v}-x86_64-unknown-linux-musl.tar.gz
bat      v0.26.1  always  bat       https://github.com/sharkdp/bat/releases/download/{v}/bat-{v}-x86_64-unknown-linux-musl.tar.gz
fzf      0.74.2   always  fzf       https://github.com/junegunn/fzf/releases/download/v{v}/fzf-{v}-linux_amd64.tar.gz
tmux     3.7b     always  tmux      https://github.com/tmux/tmux-builds/releases/download/v{v}/tmux-{v}-linux-x86_64.tar.gz

# .aliases and `lsth` both degrade gracefully without vivid, so it is opt-in.
vivid    v0.10.1  never   vivid     https://github.com/sharkdp/vivid/releases/download/{v}/vivid-{v}-x86_64-unknown-linux-musl.tar.gz
